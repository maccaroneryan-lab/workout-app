<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workout Tracker</title>

<style>

/* ---------- GLOBAL ---------- */

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  margin:0;
  background:#f4f4f4;
}

/* ---------- HEADER ---------- */

.header{
  position:relative;
  text-align:center;
  padding:16px;
  font-size:22px;
  font-weight:700;
  background:white;
}

.header-title{
  pointer-events:none;
}

.header-logo{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  height:28px;
  opacity:0.75;
}

.header-bar{
  height:6px;
  background:black;
}

/* ---------- TABS ---------- */

.tabs{
  display:flex;
  background:white;
  border-bottom:1px solid #ddd;
}

.tab{
  flex:1;
  padding:14px;
  text-align:center;
  cursor:pointer;
}

.tab.active{
  font-weight:700;
  border-bottom:3px solid black;
}

.tab-content{
  display:none;
  padding:16px;
}

.tab-content.active{display:block}

/* ---------- CARD ---------- */

.card{
  background:white;
  padding:16px;
  border-radius:12px;
  margin-bottom:16px;
}

/* ---------- BUTTON ---------- */

button{
  background:black;
  color:white;
  border:none;
  padding:12px;
  border-radius:10px;
  width:100%;
  margin-top:8px;
}

/* ---------- INPUT ---------- */

input{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ddd;
}

/* ---------- WORKOUT ---------- */

.exercise{
  margin-bottom:20px;
}

.exercise-title{
  font-weight:600;
  margin-bottom:6px;
}

.youtube-link{
  font-size:14px;
}

/* ---------- CALENDAR ---------- */

.calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.calendar-header button{
  background:black;
  color:white;
  border:none;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:18px;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.day{
  height:48px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:10px;
  background:white;
  cursor:pointer;
  position:relative;
}

.day.today{border:2px solid black}

.day.workout::after{
  content:"";
  width:8px;
  height:8px;
  background:#2ecc71;
  border-radius:50%;
  position:absolute;
  bottom:6px;
}

/* ---------- PROGRESS ---------- */

canvas{
  background:white;
  border-radius:12px;
}

</style>
</head>

<body>

<!-- HEADER WITH LOGO -->
<div class="header">
  <div class="header-title">Workout Tracker</div>
  <img src="logo.png" class="header-logo">
</div>

<div class="header-bar"></div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="showTab('home',event)">Home</div>
  <div class="tab" onclick="showTab('workout',event)">Workout</div>
  <div class="tab" onclick="showTab('progress',event)">Progress</div>
  <div class="tab" onclick="showTab('calendar',event)">Calendar</div>
</div>

<!-- HOME -->
<div id="home" class="tab-content active">
  <div class="card">
    <h3>Current Streak</h3>
    <div id="streak">0 days</div>
  </div>

  <div class="card">
    <button onclick="showTab('workout',event)">Start Workout</button>
  </div>
</div>

<!-- WORKOUT -->
<div id="workout" class="tab-content">
  <div class="card">
    <h3 id="exerciseName"></h3>

    <a id="youtubeSearch" class="youtube-link" target="_blank">
      Search demo on YouTube
    </a>

    <label>Weight</label>
    <input id="weightInput">

    <label>Reps</label>
    <input id="repsInput">

    <button onclick="nextExercise()">Next Exercise</button>
    <button onclick="saveWorkout()">Finish Workout</button>
  </div>
</div>

<!-- PROGRESS -->
<div id="progress" class="tab-content">
  <div class="card">
    <h3>Workouts Per Week</h3>
    <canvas id="progressChart"></canvas>
  </div>
</div>

<!-- CALENDAR -->
<div id="calendar" class="tab-content">

  <div class="calendar-header">
    <button onclick="changeMonth(-1)">&lt;</button>

    <div>
      <select id="monthSelect"></select>
      <select id="yearSelect"></select>
    </div>

    <button onclick="changeMonth(1)">&gt;</button>
  </div>

  <div class="calendar-grid" id="calendarGrid"></div>

</div>

<script>

/* ---------- STORAGE ---------- */

function getHistory(){
  return JSON.parse(localStorage.getItem("workouts")||"{}")
}

function saveHistory(data){
  localStorage.setItem("workouts",JSON.stringify(data))
}

/* ---------- TAB NAV ---------- */

function showTab(id,e){
  document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"))
  document.getElementById(id).classList.add("active")

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))
  if(e) e.target.classList.add("active")

  if(id==="calendar") renderCalendar()
  if(id==="progress") drawChart()
  if(id==="home") updateStreak()
}

/* ---------- WORKOUT ---------- */

const exercises=[
"Bench Press",
"Incline Press",
"Goblet Squat",
"Pushups",
"Rows"
]

let currentExercise=0
let workoutSession=[]

function loadExercise(){
  const name=exercises[currentExercise]
  document.getElementById("exerciseName").innerText=name
  document.getElementById("youtubeSearch").href=
  "https://www.youtube.com/results?search_query="+encodeURIComponent(name+" exercise")

  document.getElementById("weightInput").value=""
  document.getElementById("repsInput").value=""
}

loadExercise()

function nextExercise(){
  const weight=document.getElementById("weightInput").value
  const reps=document.getElementById("repsInput").value

  workoutSession.push({
    exercise:exercises[currentExercise],
    weight,
    reps
  })

  currentExercise=(currentExercise+1)%exercises.length
  loadExercise()
}

function saveWorkout(){
  const history=getHistory()
  const today=new Date().toISOString().split("T")[0]

  history[today]=workoutSession
  saveHistory(history)

  workoutSession=[]
  alert("Workout saved!")

  updateStreak()
}

/* ---------- STREAK ---------- */

function updateStreak(){
  const history=getHistory()
  let streak=0
  let date=new Date()

  while(true){
    const d=date.toISOString().split("T")[0]
    if(history[d]) streak++
    else break
    date.setDate(date.getDate()-1)
  }

  document.getElementById("streak").innerText=streak+" days"
}

/* ---------- CALENDAR ---------- */

let currentDate=new Date()

const months=[
"January","February","March","April","May","June",
"July","August","September","October","November","December"
]

function setupSelectors(){
  const m=document.getElementById("monthSelect")
  const y=document.getElementById("yearSelect")

  months.forEach((mo,i)=>{
    let o=document.createElement("option")
    o.value=i
    o.text=mo
    m.appendChild(o)
  })

  for(let yr=2020;yr<=2035;yr++){
    let o=document.createElement("option")
    o.value=yr
    o.text=yr
    y.appendChild(o)
  }

  m.value=currentDate.getMonth()
  y.value=currentDate.getFullYear()

  m.onchange=renderCalendar
  y.onchange=renderCalendar
}

setupSelectors()

function changeMonth(dir){
  currentDate.setMonth(currentDate.getMonth()+dir)
  monthSelect.value=currentDate.getMonth()
  yearSelect.value=currentDate.getFullYear()
  renderCalendar()
}

function renderCalendar(){
  const grid=document.getElementById("calendarGrid")
  grid.innerHTML=""

  const month=parseInt(monthSelect.value)
  const year=parseInt(yearSelect.value)
  const history=getHistory()

  const first=new Date(year,month,1).getDay()
  const days=new Date(year,month+1,0).getDate()

  const dayNames=["Su","Mo","Tu","We","Th","Fr","Sa"]

  dayNames.forEach(d=>{
    let el=document.createElement("div")
    el.innerText=d
    grid.appendChild(el)
  })

  for(let i=0;i<first;i++) grid.appendChild(document.createElement("div"))

  for(let d=1;d<=days;d++){
    let day=document.createElement("div")
    day.className="day"
    day.innerText=d

    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`

    let today=new Date()
    if(d===today.getDate() && month===today.getMonth() && year===today.getFullYear()){
      day.classList.add("today")
    }

    if(history[dateStr]) day.classList.add("workout")

    day.onclick=()=>viewWorkout(dateStr)

    grid.appendChild(day)
  }
}

function viewWorkout(date){
  const history=getHistory()
  if(!history[date]) return alert("No workout recorded")

  let text="Workout on "+date+"\n\n"
  history[date].forEach(w=>{
    text+=`${w.exercise} - ${w.weight} lb x ${w.reps}\n`
  })

  alert(text)
}

/* ---------- PROGRESS ---------- */

function drawChart(){
  const history=getHistory()
  const canvas=document.getElementById("progressChart")
  const ctx=canvas.getContext("2d")

  canvas.width=300
  canvas.height=200

  ctx.clearRect(0,0,300,200)

  const dates=Object.keys(history).slice(-7)

  dates.forEach((d,i)=>{
    const h=history[d].length*20
    ctx.fillRect(i*40+20,180-h,20,h)
  })
}

updateStreak()

</script>

</body>
</html>
